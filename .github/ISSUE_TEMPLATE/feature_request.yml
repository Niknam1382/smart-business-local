name: پیشنهاد قابلیت | Feature request
description: ایده‌ای برای بهتر شدن برنامه | An idea to improve the app
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: چه مشکلی داری؟ | What problem are you solving?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: راه‌حل پیشنهادی | Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: جایگزین‌هایی که فکر کردی | Alternatives considered
