name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app tests

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ویندوز و مک «آزمایشی»‌ان: تست‌ها از اول روی لینوکس نوشته و اجرا شدن؛ شکستشون CI رو قرمز نمی‌کنه
    # ولی توی نتیجه دیده می‌شه (وقتی سبز شدن، experimental رو false کن).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
          - os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: python -m pytest
