[project]
name = "smart-business-local"
dynamic = ["version"]
description = "Free, open-source Telegram shop assistant that runs on your own computer, with a local GGUF model (no API keys, no servers)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools.dynamic]
# تنها منبعِ حقیقتِ نسخه — ورک‌فلوی انتشار تگ را با همان می‌سنجد
version = { attr = "app.version.__version__" }

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# فقط خطاهای واقعی (سینتکس، import/متغیرِ بلااستفاده، نام‌های تعریف‌نشده)؛ سلیقه‌ای نیست
select = ["E9", "F"]
